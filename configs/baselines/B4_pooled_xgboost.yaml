condition: B4
display_name: Pooled XGBoost
role: baseline
description: >
  One dataset-blind gradient-boosted tree model (XGBoost, multiclass, GPU)
  trained on all pooled training rows with the same 47 prepared features and
  the same square-root inverse-frequency class weights as M (as per-row
  sample weights). No dataset identity, resampling, feature engineering,
  custom loss, thresholds or calibration. The boosting round is selected by
  validation macro-F1, like M's Stage-C epoch. Four configurations are tuned
  once on seed 0 (validation only); the chosen one is used for every seed.
  Trained on a GPU (40 GB class, e.g. A100); uses nothing from M.
expected_total_parameters: null
overrides:
  architecture: pooled_xgboost
  xgboost:
    # auto: the GPU when one is present (cuda), else the CPU (tests only;
    # all rows on a CPU are impractically slow).
    device: auto
    # Fixed for every run (XGBoost defaults for everything not listed). The
    # code sets objective multi:softprob, num_class, tree_method hist and the
    # seed (1000 + campaign seed).
    params:
      grow_policy: lossguide     # leaf-wise growth, limited by max_leaves (as LightGBM)
      max_depth: 0               # no depth limit; max_leaves limits the trees
      max_bin: 256
      reg_lambda: 1.0            # L2 penalty on leaf values (XGBoost's default)
      min_child_weight: 1.0      # XGBoost's default
      subsample: 0.8
      colsample_bytree: 0.8
    # Tuning grid, run once on the tuning seed; selection by validation macro-F1.
    grid:
      max_leaves: [63, 255]
      learning_rate: [0.05, 0.1]
    max_rounds: 2000
    # If the chosen configuration's best round lies within the last
    # `patience_rounds` of max_rounds during tuning, the seed runs use this cap.
    extended_max_rounds: 4000
    eval_every_rounds: 10
    patience_rounds: 200
    # Every run boosts in one pass and saves a checkpoint every
    # checkpoint_rounds rounds; after a disconnect it resumes from the last one.
    checkpoint_rounds: 200
    tuning:
      seed: 0
      # A timing pilot (pilot_rounds of the largest configuration on all
      # training rows) records seconds per round and GPU memory in pilot.json
      # before the grid (0: no pilot). It changes no setting.
      pilot_rounds: 20
