condition: B4
display_name: Pooled LightGBM
role: baseline
description: >
  One dataset-blind gradient-boosted tree model (LightGBM, multiclass) trained
  with the same 47 prepared features and the same square-root
  inverse-frequency class weights as M (as per-row sample weights). For
  compute, every B4 run uses one fixed class-capped sample of the pooled
  training rows (about 10%): smaller classes keep every row, larger ones are
  thinned and reweighted so the weighted loss equals M's in expectation. No
  dataset identity, feature engineering, custom loss, thresholds or
  calibration. The boosting round is selected by
  validation macro-F1, like M's Stage-C epoch. Four configurations are tuned
  once on seed 0 (validation only); the chosen one is used for every seed.
  Trained on CPU; uses nothing from M.
expected_total_parameters: null
overrides:
  architecture: pooled_lightgbm
  lightgbm:
    # Fixed for every run (LightGBM defaults for everything not listed).
    params:
      objective: multiclass
      max_bin: 255
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      deterministic: true
      force_row_wise: true
      feature_pre_filter: false
    # Tuning grid, run once on the tuning seed; selection by validation macro-F1.
    grid:
      num_leaves: [63, 255]
      learning_rate: [0.05, 0.1]
    max_rounds: 2000
    # If the chosen configuration's best round lies within the last
    # `patience_rounds` of max_rounds during tuning, the seed runs use this cap.
    extended_max_rounds: 4000
    eval_every_rounds: 10
    patience_rounds: 50
    # Every run trains in fixed chunks continued from the saved model, so an
    # interrupted and resumed run follows exactly the same path as an
    # uninterrupted one.
    chunk_rounds: 200
    # One fixed training sample for every B4 run (tuning and seeds). Classes
    # with at most `cap` rows keep all rows; larger classes keep `cap` rows,
    # drawn uniformly; `cap` is the largest value that keeps the sample within
    # target_fraction of all training rows. Kept rows of class c are weighted
    # by n_c / k_c on top of M's class weight. Validation and test are complete.
    training_sample:
      target_fraction: 0.1
      seed: 0
    tuning:
      seed: 0
      # A timing pilot (pilot_rounds of the largest configuration on the
      # training sample) projects the grid; above max_projected_hours tuning
      # stops before training (null: no pilot).
      max_projected_hours: 24
      pilot_rounds: 20
